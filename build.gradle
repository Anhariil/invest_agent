plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group 'ru.invest.agent'
version '0.0.2-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'ru.tinkoff.piapi:java-sdk-core:1.5'

    implementation 'org.aspectj:aspectjweaver:1.9.24'

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.3.0'

    implementation 'org.projectlombok:lombok:1.18.30'

    implementation 'org.wiremock.integrations:wiremock-spring-boot:3.10.0'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Thymeleaf на замену JSP
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect'

    implementation 'io.grpc:grpc-netty-shaded:1.63.0' // Актуальная версия

    // мат часть
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'com.opencsv:opencsv:5.7.1'
    implementation 'org.ta4j:ta4j-core:0.15'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // telegram
    implementation 'org.telegram:telegrambots:6.9.7.1'

    // конвертация  json в объект класса
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Для работы с .env файлами
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework:spring-webflux' // Для MockMvc
    testImplementation 'org.testcontainers:junit-jupiter'

}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
//	executionData files('build/jacoco/test.exec')
//	sourceSets sourceSets.main
}