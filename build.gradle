plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group 'ru.invest_agent'
version '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'

    implementation 'org.springframework.boot:spring-boot-starter-web'
//    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'ru.tinkoff.piapi:java-sdk-core:1.5'

    implementation 'org.aspectj:aspectjweaver:1.9.24'

    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign:4.3.0'

    implementation 'org.projectlombok:lombok:1.18.30'

    implementation 'org.wiremock.integrations:wiremock-spring-boot:3.10.0'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // JSTL для работы с тегами в JSP
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    implementation 'org.apache.tomcat.embed:tomcat-embed-jasper'

    implementation 'io.grpc:grpc-netty-shaded:1.63.0' // Актуальная версия

    // Для работы с Jakarta EE (требуется для Spring Boot 3+)
    implementation 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'

}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

tasks.jacocoTestReport {
    dependsOn tasks.test
    reports {
        xml.required = true
        html.required = true
    }
//	executionData files('build/jacoco/test.exec')
//	sourceSets sourceSets.main
}