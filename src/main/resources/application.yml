invest_api:
  token:
    # ${INVEST_API_TOKEN_SANDBOX} # передаем через параметры при запуске приложения например
    # java -jar app.jar --spring.profiles.active=prod \
    #  -DPROD_BOT_TOKEN=your_prod_token \
    sand_box: ${INVEST_API_TOKEN_SANDBOX}
    account_id: ${TINKOFF_DEFAULT_ACCOUNT_ID}
  scheduler:
    operation:
      enabled: true

telegram:
  chat:
    id: ${TELEGRAM_CHAT_ID} # TODO берем из бд, не храним в конфиге? оставить свой как дефолт?
    error_id: ${TELEGRAM_ERROR_CHAT_ID:-${TELEGRAM_CHAT_ID}}  #TODO мой чат айди для увед и ошибок
  bot:
    token: ${TELEGRAM_BOT_TOKEN} #сейчас старый  бот для теста
    # напишите @BotFather в Telegram /n Используйте команду /newbot и следуйте инструкциям /n Получите API-токен вида 1234567890:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi
    start.event.message: false

spring:

#  datasource:
#    url: ${DB_URL}
#    username: ${DB_USER}
#    password: ${DB_PASSWORD}

  data:
    mongodb:
      uri: ${DB_MONGO_URL}

  thymeleaf:
#    cache: false # false Для разработки
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  banner:
    charset: UTF-8
    web:
      encoding:
        charset: UTF-8
        force: true
        enabled: true

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    ru.invest.agent: DEBUG
      # Отключаем DEBUG логи для Apache HTTP Client
    org.apache.hc: WARN
    org.apache.http: WARN

    # смотрим логи по монге
    org.springframework.data.mongodb.core: INFO
    org.mongodb.driver: INFO

file:
  encoding: UTF-8
  path: ${FILE_PATH}

---
# Профиль dev
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: DEBUG
    ru.invest.agent: TRACE
#    org.springframework: DEBUG
#    org.springframework.data: DEBUG
#    org.springframework.data.mongodb.core: DEBUG
#    org.mongodb.driver: DEBUG
#    org.hibernate.SQL: DEBUG
#    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.fasterxml.jackson.databind: DEBUG

invest_api:
  scheduler:
    operation:
      enabled: false

---
# Профиль prod
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    root: WARN
    ru.invest.agent: INFO
    org.springframework: WARN
    org.mongodb.driver: WARN

telegram.bot.start.event.message: true