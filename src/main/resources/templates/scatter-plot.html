<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Scatter Plot</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container {
            width: 80%;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="chart-container">
        <canvas id="scatterChart"></canvas>
    </div>

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            // Получаем данные из Thymeleaf
            const xValues = JSON.parse(/*[[${xValues}]]*/ '[1,2,3,4,5]');
            const yValues = JSON.parse(/*[[${yValues}]]*/ '[2,3,5,7,11]');

            // Преобразуем в массив точек {x, y}
            const points = xValues.map((x, index) => ({
                x: x,
                y: yValues[index]
            }));

            // Создаем график
            const ctx = document.getElementById('scatterChart').getContext('2d');
            new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: [{
                        label: 'Точки данных',
                        data: points,
                        backgroundColor: 'rgba(255, 99, 132, 0.7)',
                        borderColor: 'rgba(255, 99, 132, 1)',
                        borderWidth: 1,
                        pointRadius: 6
                    }]
                },
                options: {
                    scales: {
                        x: {
                            type: 'linear',
                            position: 'bottom',
                            title: {
                                display: true,
                                text: 'Ось X'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Ось Y'
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `(${context.parsed.x}, ${context.parsed.y})`;
                                }
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>
</html>
